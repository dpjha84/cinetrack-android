name: Android build
on:
  workflow_dispatch:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    env:
      KS_B64: ${{ secrets.UPLOAD_KEYSTORE_BASE64 }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: 21 }
      # app/build.gradle.kts signs the debug build with ${rootDir}/debug.keystore, which is
      # gitignored, so generate one (or restore it from debug.keystore.base64 if committed).
      - name: Prepare debug keystore
        run: |
          if [ -f debug.keystore.base64 ]; then
            base64 -d debug.keystore.base64 > debug.keystore
          else
            keytool -genkeypair -keystore debug.keystore -alias androiddebugkey \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass android -keypass android \
              -dname "CN=Android Debug,O=Android,C=US"
          fi
      # Test APK (debug-signed, installable on any phone)
      - run: chmod +x gradlew && ./gradlew assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with: { name: cinetrack-debug-apk, path: app/build/outputs/apk/debug/*.apk }
      # Signed AAB for Play Store (only if the signing secrets are set).
      # The key alias must be "upload" (hardcoded in app/build.gradle.kts).
      - name: Signed release AAB
        if: ${{ env.KS_B64 != '' }}
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/upload.jks
          STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          echo "$KS_B64" | base64 -d > "$KEYSTORE_PATH"
          ./gradlew bundleRelease --stacktrace
      - uses: actions/upload-artifact@v4
        if: ${{ hashFiles('app/build/outputs/bundle/release/*.aab') != '' }}
        with: { name: cinetrack-release-aab, path: app/build/outputs/bundle/release/*.aab }
