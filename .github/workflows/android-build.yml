name: Android build
on:
  workflow_dispatch:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    env:
      KS_B64: ${{ secrets.UPLOAD_KEYSTORE_BASE64 }}
      GRADLE_OPTS: "-Dorg.gradle.internal.http.connectionTimeout=60000 -Dorg.gradle.internal.http.socketTimeout=60000"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: 21 }
      - uses: gradle/actions/setup-gradle@v4

      # app/build.gradle.kts signs the debug build with ${rootDir}/debug.keystore, which is
      # gitignored, so generate one (or restore it from debug.keystore.base64 if committed).
      - name: Prepare debug keystore
        run: |
          if [ -f debug.keystore.base64 ]; then
            base64 -d debug.keystore.base64 > debug.keystore
          else
            keytool -genkeypair -keystore debug.keystore -alias androiddebugkey \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass android -keypass android \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      # Firebase config from the GOOGLE_SERVICES_JSON secret (raw JSON or base64).
      - name: Write google-services.json
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -z "$GOOGLE_SERVICES_JSON" ]; then
            echo "::warning::GOOGLE_SERVICES_JSON secret is empty, building without Firebase config."
            exit 0
          fi
          if printf '%s' "$GOOGLE_SERVICES_JSON" | head -c1 | grep -q '{'; then
            printf '%s' "$GOOGLE_SERVICES_JSON" > app/google-services.json
          else
            printf '%s' "$GOOGLE_SERVICES_JSON" | base64 --decode > app/google-services.json
          fi
          python3 -c "import json; json.load(open('app/google-services.json')); print('google-services.json OK')"

      # Test APK (debug-signed, installable on any phone)
      - name: Build debug APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace || ./gradlew assembleDebug --refresh-dependencies --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: watchpilot-debug-apk
          path: app/build/outputs/apk/debug/*.apk

      # Signed AAB for Play Store (requires UPLOAD_KEYSTORE_BASE64, KEYSTORE_PASSWORD, KEY_PASSWORD secrets).
      # The key alias must be "upload" (hardcoded in app/build.gradle.kts).
      - name: Signed release AAB
        if: ${{ env.KS_B64 != '' }}
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/upload.jks
          STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          echo "$KS_B64" | base64 -d > "$KEYSTORE_PATH"
          ./gradlew bundleRelease --stacktrace
      - uses: actions/upload-artifact@v4
        if: ${{ hashFiles('app/build/outputs/bundle/release/*.aab') != '' }}
        with:
          name: watchpilot-release-aab
          path: app/build/outputs/bundle/release/*.aab
